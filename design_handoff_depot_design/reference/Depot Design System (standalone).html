document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

numeric:tabular-nums;line-height:1.5\">\n\n  <!-- ============ TOP BAR ============ -->\n  <header style=\"position:sticky;top:0;z-index:60;backdrop-filter:blur(12px);background:color-mix(in oklab,var(--card) 78%,transparent);border-bottom:1px solid var(--border)\">\n    <div style=\"max-width:1180px;margin:0 auto;padding:14px 32px;display:flex;align-items:center;gap:20px\">\n      <div style=\"display:flex;align-items:center;gap:11px;flex:none\">\n        <div style=\"width:34px;height:34px;border-radius:11px;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-soft)\">\n          <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--primary-foreground)\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 3v18h18\"><\u002Fpath><path d=\"m7 14 3-4 4 3 5-7\"><\u002Fpath><\u002Fsvg>\n        <\u002Fdiv>\n        <div style=\"line-height:1.15\">\n          <div style=\"font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.01em\">Depot Design<\u002Fdiv>\n          <div style=\"font-size:11px;color:var(--muted-foreground)\">System v1.0<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <nav style=\"display:none;gap:4px;margin-left:8px;flex:1\" class=\"om-topnav\">\n      <\u002Fnav>\n      <div style=\"display:flex;align-items:center;gap:6px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end\">\n        <a href=\"#farben\" style=\"text-decoration:none;color:var(--muted-foreground);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px\">Farben<\u002Fa>\n        <a href=\"#typografie\" style=\"text-decoration:none;color:var(--muted-foreground);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px\">Typografie<\u002Fa>\n        <a href=\"#form\" style=\"text-decoration:none;color:var(--muted-foreground);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px\">Form<\u002Fa>\n        <a href=\"#bausteine\" style=\"text-decoration:none;color:var(--muted-foreground);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px\">Bausteine<\u002Fa>\n        <a href=\"#vorlagen\" style=\"text-decoration:none;color:var(--muted-foreground);font-size:13px;font-weight:500;padding:7px 11px;border-radius:9px\">Vorlagen<\u002Fa>\n        <button onclick=\"{{ toggleTheme }}\" style=\"display:inline-flex;align-items:center;gap:7px;margin-left:6px;padding:8px 13px;border-radius:999px;border:1px solid var(--border);background:var(--card);color:var(--foreground);font:600 13px var(--font-sans);cursor:pointer;box-shadow:var(--shadow-soft)\">\n          <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg>\n          <span>{{ themeLabel }}<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fheader>\n\n  <!-- ============ HERO ============ -->\n  <section style=\"max-width:1180px;margin:0 auto;padding:72px 32px 28px\">\n    <div style=\"display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border-radius:999px;background:color-mix(in oklab,var(--primary) 12%,transparent);color:var(--primary);font:600 12px var(--font-sans);letter-spacing:.04em;margin-bottom:20px\">\n      <span style=\"width:7px;height:7px;border-radius:999px;background:var(--primary)\"><\u002Fspan>\n      Wiederverwendbares Design-System\n    <\u002Fdiv>\n    <h1 style=\"font-family:var(--font-display);font-weight:800;font-size:clamp(40px,6vw,68px);line-height:1.02;letter-spacing:-.03em;margin:0 0 20px;max-width:16ch\">Warm, ruhig, datenklar.<\u002Fh1>\n    <p style=\"font-size:18px;line-height:1.6;color:var(--muted-foreground);max-width:62ch;margin:0 0 34px\">Ein vollständi u002Fdiv>\n    <\u002Fdiv>\n    <p style=\"font-size:13px;color:var(--muted-foreground);max-width:60ch;margin:0\">Alle Bausteine nutzen dieselben Farb-, Schrift- und Form-Tokens. Für ein neues Projekt: Tokens kopieren, Theme über <code style=\"font-family:var(--font-mono)\">data-theme=\"dark\"<\u002Fcode> umschalten, Bausteine zusammensetzen.<\u002Fp>\n  <\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { theme:'light', seg:'Monat', switchA:true, switchB:false, modalOpen:false };\n  renderVals(){\n    const isDark = this.state.theme === 'dark';\n    const segItem = (name)=>({\n      onClick: ()=>this.setState({seg:name}),\n      style: this.state.seg===name\n        ? {flex:'1',padding:'7px 0',borderRadius:'999px',border:'none',cursor:'pointer',font:'600 13px var(--font-sans)',background:'var(--card)',color:'var(--foreground)',boxShadow:'var(--shadow-soft)'}\n        : {flex:'1',padding:'7px 0',borderRadius:'999px',border:'none',cursor:'pointer',font:'500 13px var(--font-sans)',background:'transparent',color:'var(--muted-foreground)'}\n    });\n    const track = (on)=>({width:'42px',height:'24px',borderRadius:'999px',background:on?'var(--primary)':'var(--border)',position:'relative',transition:'background .2s',cursor:'pointer',border:'none',padding:0,flex:'none'});\n    const knob = (on)=>({position:'absolute',top:'3px',left:on?'21px':'3px',width:'18px',height:'18px',borderRadius:'999px',background:'#fff',transition:'left .2s ease',boxShadow:'0 1px 3px rgba(0,0,0,.25)'});\n    return {\n      themeAttr: this.state.theme,\n      isDark,\n      themeLabel: isDark ? 'Hell' : 'Dunkel',\n      toggleTheme: ()=>this.setState(s=>({theme: s.theme==='dark'?'light':'dark'})),\n      segMonat: segItem('Monat'), segQuartal: segItem('Quartal'), segJahr: segItem('Jahr'),\n      switchA: this.state.switchA, switchB: this.state.switchB,\n      trackA: track(this.state.switchA), knobA: knob(this.state.switchA),\n      trackB: track(this.state.switchB), knobB: knob(this.state.switchB),\n      toggleA: ()=>this.setState(s=>({switchA:!s.switchA})),\n      toggleB: ()=>this.setState(s=>({switchB:!s.switchB})),\n      modalOpen: this.state.modalOpen,\n      openModal: ()=>this.setState({modalOpen:true}),\n      closeModal: ()=>this.setState({modalOpen:false}),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
