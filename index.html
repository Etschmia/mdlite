<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="appTitle">mdlite — Markdown Editor</title>
  <meta name="description" data-i18n-content="metaDescription" content="Ein schlanker Markdown-Editor: Live-Vorschau, Tabs, lokales Speichern. Ohne Login, ohne Schnickschnack.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">

  <!-- TOP BAR -->
  <header class="topbar">
    <button id="btn-sidebar" class="icon-btn" title="Seitenleiste ein-/ausblenden" aria-label="Seitenleiste">
      <svg class="icon-desktop" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      <svg class="mv-icon mv-sidebar" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
      <svg class="mv-icon mv-editor" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
      <svg class="mv-icon mv-preview" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
    <div class="logo">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="var(--primary-foreground)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15V9l3 3 3-3v6M14 9v6M17 12l-3 3-3-3"/></svg>
    </div>
    <div class="app-name">mdlite</div>

    <div class="file-menu-wrap">
      <button id="btn-file" class="text-btn" aria-haspopup="menu">
        <span data-i18n="file">Datei</span>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </button>
      <div id="file-menu" class="dropdown" role="menu" hidden>
        <button class="menu-item" data-cmd="new"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v5h5M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M12 11v6M9 14h6"/></svg><span data-i18n="newDoc">Neues Dokument</span><span class="shortcut">⌘N</span></button>
        <button class="menu-item" data-cmd="open"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.5l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2Z"/></svg><span data-i18n="open">Öffnen…</span><span class="shortcut">⌘O</span></button>
        <button class="menu-item" data-cmd="save"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span data-i18n="saveMd">Speichern (.md)</span><span class="shortcut">⌘S</span></button>
        <div class="menu-sep"></div>
        <button class="menu-item" data-cmd="export-html"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg><span data-i18n="exportHtml">Als HTML exportieren</span></button>
        <button class="menu-item" data-cmd="print"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V2h12v7M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2M6 14h12v8H6z"/></svg><span data-i18n="print">Drucken / PDF</span></button>
      </div>
    </div>

    <div class="spacer"></div>

    <div class="segmented" role="group" aria-label="Ansicht" data-i18n-aria="view">
      <button id="seg-editor" class="seg-btn" data-view="editor" title="Nur Editor" data-i18n-title="viewEditor"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <button id="seg-split" class="seg-btn" data-view="split" title="Geteilte Ansicht" data-i18n-title="viewSplit"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M12 4v16"/></svg></button>
      <button id="seg-preview" class="seg-btn" data-view="preview" title="Nur Vorschau" data-i18n-title="viewPreview"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>

    <button id="btn-settings" class="icon-btn" title="Einstellungen" aria-label="Einstellungen" data-i18n-title="settings" data-i18n-aria="settings">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
    </button>
    <button id="btn-theme" class="icon-btn" title="Hell / Dunkel umschalten" aria-label="Theme umschalten" data-i18n-title="themeToggle" data-i18n-aria="themeToggleAria">
      <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </button>
  </header>

  <!-- TAB STRIP -->
  <div class="tabstrip" id="tabstrip">
    <div id="tabs" class="tabs"></div>
    <button id="btn-newtab" class="newtab-btn" title="Neuer Tab (Doppelklick auf Tab = umbenennen)" aria-label="Neuer Tab" data-i18n-title="newTab" data-i18n-aria="newTabAria">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>

  <!-- BODY -->
  <div class="body">
    <aside id="sidebar" class="sidebar side-scroll">
      <div class="sidebar-head">
        <div class="sidebar-label" data-i18n="documents">Dokumente</div>
        <span id="doc-count" class="count-pill">0</span>
      </div>
      <div id="doc-list" class="doc-list"></div>
    </aside>

    <div id="resizer-sidebar" class="resizer" role="separator" aria-orientation="vertical" aria-label="Breite der Seitenleiste anpassen" data-i18n-aria="resizeSidebar" tabindex="0" hidden></div>

    <section id="editor-pane" class="editor-pane">
      <div class="toolbar" role="toolbar" aria-label="Formatierung" data-i18n-aria="formatting">
        <button class="tbtn" data-fmt="bold" title="Fett — ⌘B" data-i18n-title="bold"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4h8a4 4 0 0 1 0 8H6zM6 12h9a4 4 0 0 1 0 8H6z"/></svg></button>
        <button class="tbtn" data-fmt="italic" title="Kursiv — ⌘I" data-i18n-title="italic"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 4h-9M14 20H5M15 4 9 20"/></svg></button>
        <button class="tbtn" data-fmt="strike" title="Durchgestrichen" data-i18n-title="strike"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4H9a3 3 0 0 0-2.83 4M14 12a4 4 0 0 1 0 8H6M4 12h16"/></svg></button>
        <button class="tbtn" data-fmt="code" title="Code (inline) — ⌘E" data-i18n-title="code"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m16 18 6-6-6-6M8 6l-6 6 6 6"/></svg></button>
        <span class="tsep"></span>
        <button class="tbtn-txt" data-fmt="h1" title="Überschrift 1" data-i18n-title="h1">H1</button>
        <button class="tbtn-txt" data-fmt="h2" title="Überschrift 2" data-i18n-title="h2">H2</button>
        <button class="tbtn-txt" data-fmt="h3" title="Überschrift 3" data-i18n-title="h3">H3</button>
        <span class="tsep"></span>
        <button class="tbtn" data-fmt="ul" title="Aufzählung" data-i18n-title="ul"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg></button>
        <button class="tbtn" data-fmt="ol" title="Nummerierte Liste" data-i18n-title="ol"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6h11M10 12h11M10 18h11M4 6h1v4M4 10h2M6 18H4l2-2.5V15a1 1 0 0 0-2 0"/></svg></button>
        <button class="tbtn" data-fmt="check" title="Checkliste" data-i18n-title="check"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 2 2 3-3M3 17l2 2 3-3M13 6h8M13 12h8M13 18h8"/></svg></button>
        <button class="tbtn" data-fmt="quote" title="Zitat" data-i18n-title="quote"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 17h3l2-4V7H5v6h4M14 17h3l2-4V7h-6v6h4"/></svg></button>
        <span class="tsep"></span>
        <button class="tbtn" data-fmt="link" title="Link — ⌘K" data-i18n-title="link"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg></button>
        <button class="tbtn" data-fmt="image" title="Bild" data-i18n-title="image"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-4.5-4.5L3 21"/></svg></button>
        <button class="tbtn" data-fmt="table" title="Tabelle" data-i18n-title="table"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18M15 3v18"/></svg></button>
        <button class="tbtn" data-fmt="codeblock" title="Codeblock" data-i18n-title="codeblock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="m9 9-2 3 2 3M15 9l2 3-2 3"/></svg></button>
        <span class="tsep"></span>
        <button class="tbtn" data-fmt="math" title="Formel (inline) — $…$" data-i18n-title="math"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 13h3l2.5 6L12 4h10"/></svg></button>
        <button class="tbtn" data-fmt="mathblock" title="Formelblock — $$…$$" data-i18n-title="mathblock"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 13h2l1.5 4L13 8h4"/></svg></button>
        <span class="tsep"></span>
        <button class="tbtn" id="btn-frontmatter" title="Frontmatter bearbeiten" data-i18n-title="frontmatterEdit"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H7a2 2 0 0 0-2 2v4a2 2 0 0 1-2 2 2 2 0 0 1 2 2v4a2 2 0 0 0 2 2h1M16 3h1a2 2 0 0 1 2 2v4a2 2 0 0 0 2 2 2 2 0 0 0-2 2v4a2 2 0 0 1-2 2h-1"/></svg></button>
      </div>
      <div class="editor-body">
        <div id="gutter" class="gutter" aria-hidden="true" hidden></div>
        <textarea id="ta" class="ed-scroll" spellcheck="false" placeholder="# Titel&#10;&#10;Schreibe hier in Markdown…" data-i18n-placeholder="editorPlaceholder"></textarea>
      </div>
    </section>

    <div id="resizer-split" class="resizer" role="separator" aria-orientation="vertical" aria-label="Aufteilung zwischen Editor und Vorschau anpassen" data-i18n-aria="resizeSplit" tabindex="0" hidden></div>

    <section id="preview-pane" class="preview-pane">
      <div class="prose-wrap">
        <div id="preview" class="prose"></div>
      </div>
    </section>
  </div>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    <span id="saved" class="saved"><span class="dot"></span><span id="saved-label" data-i18n="saved">Gespeichert</span></span>
    <span class="sep-dot">·</span>
    <span id="stat-words">0 Wörter</span>
    <span id="stat-chars">0 Zeichen</span>
    <span id="stat-lines">0 Zeilen</span>
    <div class="spacer"></div>
    <span id="stat-cursor" class="mono">Zeile 1, Sp. 1</span>
    <span class="sep-dot">·</span>
    <span class="mono">Markdown</span>
  </footer>

  <!-- SETTINGS DIALOG -->
  <div id="settings-overlay" class="overlay" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="sheet-head">
        <div id="settings-title" class="sheet-title" data-i18n="settings">Einstellungen</div>
        <button id="settings-close" class="icon-btn small" title="Schließen" aria-label="Schließen" data-i18n-title="close" data-i18n-aria="close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="sheet-body">
        <div class="setting-row">
          <div><div class="setting-name" data-i18n="fontSize">Schriftgröße im Editor</div><div id="fontsize-current" class="setting-desc">Aktuell 15 px</div></div>
          <div class="stepper">
            <button id="font-down" class="step-btn" aria-label="Kleiner" data-i18n-aria="smaller">−</button>
            <span id="fontsize-value" class="step-value">15</span>
            <button id="font-up" class="step-btn" aria-label="Größer" data-i18n-aria="larger">+</button>
          </div>
        </div>
        <div class="setting-row">
          <div><div class="setting-name" data-i18n="lineNumbers">Zeilennummern</div><div class="setting-desc" data-i18n="lineNumbersDesc">Nummern-Spalte links anzeigen</div></div>
          <button id="toggle-linenumbers" class="switch" role="switch" aria-checked="true" aria-label="Zeilennummern" data-i18n-aria="lineNumbers"><span class="knob"></span></button>
        </div>
        <div class="setting-row">
          <div><div class="setting-name" data-i18n="appearance">Erscheinungsbild</div><div class="setting-desc" data-i18n="appearanceDesc">Hell oder Dunkel</div></div>
          <div class="segmented">
            <button id="set-light" class="seg-btn text" data-i18n="light">Hell</button>
            <button id="set-dark" class="seg-btn text" data-i18n="dark">Dunkel</button>
          </div>
        </div>
        <div class="setting-row">
          <div><div class="setting-name" data-i18n="language">Sprache</div><div class="setting-desc" data-i18n="languageDesc">Sprache der Oberfläche</div></div>
          <select id="lang-select" class="select" aria-label="Sprache" data-i18n-aria="language">
            <option value="de" lang="de">Deutsch</option>
            <option value="en" lang="en">English</option>
            <option value="hy" lang="hy">Հայերեն</option>
            <option value="ru" lang="ru">Русский</option>
          </select>
        </div>
        <div class="sheet-sep"></div>
        <button id="reset-all" class="danger-btn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          <span data-i18n="resetAll">Alle Dokumente zurücksetzen</span>
        </button>
      </div>
    </div>
  </div>

  <!-- FRONTMATTER DIALOG -->
  <div id="fm-overlay" class="overlay" hidden>
    <div class="sheet wide" role="dialog" aria-modal="true" aria-labelledby="fm-title">
      <div class="sheet-head">
        <div id="fm-title" class="sheet-title" data-i18n="frontmatter">Frontmatter</div>
        <button id="fm-close" class="icon-btn small" title="Schließen" aria-label="Schließen" data-i18n-title="close" data-i18n-aria="close"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="sheet-body">
        <div class="fm-header"><span data-i18n="fmKey">Schlüssel</span><span data-i18n="fmValue">Wert</span><span></span></div>
        <div id="fm-rows" class="fm-rows"></div>
        <button id="fm-add" class="outline-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span data-i18n="fmAdd">Eintrag hinzufügen</span>
        </button>
      </div>
      <div class="sheet-foot">
        <button id="fm-cancel" class="outline-btn" data-i18n="cancel">Abbrechen</button>
        <button id="fm-save" class="primary-btn" data-i18n="apply">Übernehmen</button>
      </div>
    </div>
  </div>

  <input id="file-input" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
</div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
